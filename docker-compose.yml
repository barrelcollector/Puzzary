services:
  app:
    build: .
    container_name: puzzary
    restart: unless-stopped
    ports:
      - "${PUZZARY_PORT:-8790}:${PUZZARY_PORT:-8790}"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://puzzary:puzzary@db:5432/puzzary}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8790}"
      UPLOAD_DIR: "/data/uploads"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-local-session-secret}"
      GROUP_HOST_RECONNECT_GRACE_SECONDS: "${GROUP_HOST_RECONNECT_GRACE_SECONDS:-30}"
      PUZZARY_HOST: "${PUZZARY_HOST:-0.0.0.0}"
      PUZZARY_PORT: "${PUZZARY_PORT:-8790}"
      PUZZARY_TLS_CERT_FILE: "${PUZZARY_TLS_CERT_FILE:-}"
      PUZZARY_TLS_KEY_FILE: "${PUZZARY_TLS_KEY_FILE:-}"
      PUZZARY_TLS_KEY_PASSWORD: "${PUZZARY_TLS_KEY_PASSWORD:-}"
      PUZZARY_TRUSTED_PROXIES: "${PUZZARY_TRUSTED_PROXIES:-}"
      PUZZARY_HTTPS_REDIRECT: "${PUZZARY_HTTPS_REDIRECT:-false}"
      PUZZARY_SECURE_COOKIES: "${PUZZARY_SECURE_COOKIES:-auto}"
      PUZZARY_VAPID_PRIVATE_KEY: "${PUZZARY_VAPID_PRIVATE_KEY:-}"
      PUZZARY_VAPID_SUBJECT: "${PUZZARY_VAPID_SUBJECT:-mailto:notifications@puzzary.local}"
      PUZZARY_PUSH_LOOP_SECONDS: "${PUZZARY_PUSH_LOOP_SECONDS:-10}"
      PUZZARY_PLUGIN_DIR: "${PUZZARY_PLUGIN_DIR:-/data/plugins}"
    volumes:
      - ./data:/data
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: puzzary-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-puzzary}"
      POSTGRES_USER: "${POSTGRES_USER:-puzzary}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-puzzary}"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
