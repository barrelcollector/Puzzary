services:
  app:
    build: .
    container_name: puzzary
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://puzzary:puzzary@db:5432/puzzary}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8790}"
      UPLOAD_DIR: "/data/uploads"
    volumes:
      - ./data:/data
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: puzzary-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-puzzary}"
      POSTGRES_USER: "${POSTGRES_USER:-puzzary}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-puzzary}"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
