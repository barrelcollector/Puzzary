name: Bug report
description: Report reproducible incorrect behavior in Puzzary
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private security reporting link shown in the issue chooser.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Puzzary version
      description: Release version or commit, if known.
  - type: dropdown
    id: install
    attributes:
      label: Installation type
      options:
        - Docker Compose
        - Other Docker deployment
        - Local Python environment
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Redact credentials, tokens, private links, personal data, and puzzle answers before pasting logs or screenshots.
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive information
      options:
        - label: I removed credentials, tokens, private links, and personal data from this report.
          required: true
