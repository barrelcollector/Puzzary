name: Core validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install application dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run portable checks
        run: python scripts/run_core_ci.py portable

  security-regressions:
    name: Security regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and browser dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run isolated security checks
        run: python scripts/run_core_ci.py security

  plugin-regressions:
    name: Plugin regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and browser dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run isolated plugin checks
        run: python scripts/run_core_ci.py plugins

  postgres-regressions:
    name: PostgreSQL regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: puzzary_ci
          POSTGRES_USER: puzzary
          POSTGRES_PASSWORD: puzzary-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U puzzary -d puzzary_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PERMISSIONS_QA_DATABASE: postgresql+psycopg://puzzary:puzzary-ci-only@127.0.0.1:5432/puzzary_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and browser dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run PostgreSQL permission checks
        run: python scripts/run_core_ci.py postgres

  docker-build:
    name: Production Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build production image
        run: docker build --build-arg "PUZZARY_VERSION=$(cat VERSION)" --tag puzzary:core-ci .
      - name: Verify production image version label
        run: test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' puzzary:core-ci)" = "$(cat VERSION)"

  python-security:
    name: Python security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security.txt
      - name: Install security scanner
        run: python -m pip install --requirement requirements-security.txt
      - name: Scan Python application code
        run: python -m bandit --recursive app --severity-level medium --confidence-level medium

  core-validation:
    name: Core validation
    if: always()
    needs:
      - python-matrix
      - security-regressions
      - plugin-regressions
      - postgres-regressions
      - docker-build
      - python-security
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS"]).items()}
          print(results)
          if any(result != "success" for result in results.values()):
              raise SystemExit("One or more core validation jobs did not succeed")
          PY
