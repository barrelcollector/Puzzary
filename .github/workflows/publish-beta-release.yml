name: Publish beta release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  publish:
    name: Verify and publish checksummed beta
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require every public-beta milestone issue to be closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_issues=$(gh api "repos/$GITHUB_REPOSITORY/issues?milestone=1&state=open&per_page=100" --jq 'length')
          if [ "$open_issues" -ne 0 ]; then
            echo "The v0.1.0 Public Beta milestone still has $open_issues open item(s)."
            gh api "repos/$GITHUB_REPOSITORY/issues?milestone=1&state=open&per_page=100" --jq '.[] | "#\(.number) \(.title)"'
            exit 1
          fi
      - name: Verify release metadata
        run: PYTHONPATH=. python scripts/verify_release_metadata.py
      - name: Prove clean installation and upgrade
        run: python scripts/prove_beta_release.py --baseline-ref HEAD^
      - name: Build checksummed source archive
        run: |
          version=$(cat VERSION)
          tag="v$version"
          archive="puzzary-$version.tar.gz"
          git archive --format=tar.gz --prefix="puzzary-$version/" --output "$archive" HEAD
          sha256sum "$archive" > "$archive.sha256"
          printf 'VERSION=%s\nTAG=%s\nARCHIVE=%s\n' "$version" "$tag" "$archive" >> "$GITHUB_ENV"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --target "$GITHUB_SHA" \
            --title "Puzzary $TAG" \
            --notes-file "docs/releases/$TAG.md" \
            --prerelease
