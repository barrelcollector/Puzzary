name: Dependency audit

on:
  pull_request:
    paths:
      - "requirements*.txt"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches:
      - main
    paths:
      - "requirements*.txt"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-audit.txt
      - name: Install audit tooling
        run: python -m pip install --requirement requirements-audit.txt
      - name: Audit application dependencies
        run: python -m pip_audit --requirement requirements.txt --progress-spinner off

  docker-smoke:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build and start the production stack
        run: docker compose --project-name puzzary-audit up --detach --build
      - name: Wait for application health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8790/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose --project-name puzzary-audit logs
          exit 1
      - name: Show container status
        run: docker compose --project-name puzzary-audit ps
      - name: Stop the test stack
        if: always()
        run: docker compose --project-name puzzary-audit down --volumes
