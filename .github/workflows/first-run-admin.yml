name: First-run administrator

on:
  pull_request:
    paths:
      - "app/main.py"
      - "app/models.py"
      - "app/templates/login.html"
      - "app/templates/password_setup.html"
      - "app/templates/admin_users.html"
      - "docker-compose.yml"
      - "Dockerfile"
      - "requirements.txt"
      - "scripts/verify_first_run_admin.py"
      - ".github/workflows/first-run-admin.yml"
  push:
    branches:
      - main
    paths:
      - "app/main.py"
      - "app/models.py"
      - "app/templates/login.html"
      - "app/templates/password_setup.html"
      - "app/templates/admin_users.html"
      - "docker-compose.yml"
      - "Dockerfile"
      - "requirements.txt"
      - "scripts/verify_first_run_admin.py"
      - ".github/workflows/first-run-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build and start a clean production stack
        run: docker compose --project-name puzzary-first-run up --detach --build
      - name: Wait for application health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8790/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose --project-name puzzary-first-run logs
          exit 1
      - name: Verify one-time administrator setup
        shell: bash
        run: |
          set -euo pipefail
          docker compose --project-name puzzary-first-run exec -T app test -s /data/bootstrap-admin-setup.txt
          test "$(docker compose --project-name puzzary-first-run exec -T app stat -c '%a' /data/bootstrap-admin-setup.txt | tr -d '\r')" = '600'
          setup_record="$(docker compose --project-name puzzary-first-run exec -T app cat /data/bootstrap-admin-setup.txt)"
          setup_link="$(printf '%s\n' "$setup_record" | sed -n 's/^Setup link: //p')"
          token="${setup_link##*#token=}"
          test -n "$token"
          test "$token" != "$setup_link"

          failed_headers="$(curl --silent --output /dev/null --dump-header - \
            --data-urlencode 'username=admin' --data-urlencode 'password=admin' \
            http://127.0.0.1:8790/login)"
          printf '%s' "$failed_headers" | grep -qi 'location: /login?error=Invalid%20username'

          password='First-run-Docker-2026!'
          setup_headers="$(curl --silent --output /dev/null --dump-header - \
            --data-urlencode "token=$token" --data-urlencode "password=$password" \
            --data-urlencode "confirm_password=$password" \
            http://127.0.0.1:8790/password/setup)"
          printf '%s' "$setup_headers" | grep -qi 'location: /library'
          if docker compose --project-name puzzary-first-run exec -T app test -e /data/bootstrap-admin-setup.txt; then
            echo 'Bootstrap delivery file was not removed after setup.'
            exit 1
          fi

          replay_headers="$(curl --silent --output /dev/null --dump-header - \
            --data-urlencode "token=$token" --data-urlencode "password=$password" \
            --data-urlencode "confirm_password=$password" \
            http://127.0.0.1:8790/password/setup)"
          printf '%s' "$replay_headers" | grep -qi 'invalid%20or%20expired'
          login_headers="$(curl --silent --output /dev/null --dump-header - \
            --data-urlencode 'username=admin' --data-urlencode "password=$password" \
            http://127.0.0.1:8790/login)"
          printf '%s' "$login_headers" | grep -qi 'location: /library'

          logs="$(docker compose --project-name puzzary-first-run logs app)"
          if printf '%s' "$logs" | grep -Fq "$token"; then
            echo 'Bootstrap token was exposed in container logs.'
            exit 1
          fi
      - name: Show container status
        run: docker compose --project-name puzzary-first-run ps
      - name: Stop the test stack
        if: always()
        run: docker compose --project-name puzzary-first-run down --volumes
