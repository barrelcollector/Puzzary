<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d3b36">
  <title>Puzzary is offline</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f5f5f2; color: #151515; }
    main { width: min(34rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #d7d5cc; border-radius: 8px; background: #fff; }
    img { width: 3rem; height: 3rem; } a { color: #1f6f62; font-weight: 700; }
    @media (prefers-color-scheme: dark) { body { background: #101512; color: #f3f7f4; } main { background: #1b221e; border-color: #46514a; } a { color: #64cfb8; } }
  </style>
</head>
<body>
  <main>
    <img src="/static/brand/puzzary-mark.svg?v=1" alt="">
    <h1>Puzzary is offline</h1>
    <p>The server cannot be reached. Reconnect to continue; downloaded puzzle play will be added separately.</p>
    <p><a href="/library">Try again</a></p>
  </main>
</body>
</html>
