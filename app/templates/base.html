<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Puzzary{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css?v=28">
</head>
<body>
  {% if not hide_app_chrome %}
    <header class="topbar">
      <a class="brand" href="/library">Puzzary</a>
      <span class="tagline">A puzzle library for Daily Stripe</span>
      <span class="topbar-spacer"></span>
      {% if current_user %}
        <a class="nav-link" href="/generate">Generate</a>
        {% if current_user.is_admin %}
          <a class="nav-link" href="/admin">Admin</a>
        {% endif %}
        <a class="nav-link" href="/account/password">Account</a>
        <span class="user-pill">{{ current_user.display_name }}</span>
        <form method="post" action="/logout" class="logout-form">
          <button type="submit" class="ghost-button">Log out</button>
        </form>
      {% endif %}
    </header>
  {% endif %}
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
