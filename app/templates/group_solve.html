<section id="group-solve" data-puzzle="{{ puzzle.id }}" data-group="{{ group_id }}"
         data-supported="{{ 'true' if puzzle_type_definition and puzzle_type_definition.collaboration else 'false' }}">
  {% if group_id %}
    <h2>Group Solve <span id="group-code"></span></h2>
    <p id="group-status" role="status">Connecting...</p>
    <div id="group-members" class="group-members"></div>
    <div class="group-tools">
      <button type="button" id="group-copy">Copy invite link</button>
      <button type="button" id="group-check">Check group</button>
      <button type="button" id="group-hint">Group hint</button>
      <button type="button" id="group-leave" class="ghost-button">Leave</button>
    </div>
    <details id="group-host" hidden>
      <summary>Session settings</summary>
      <form id="group-settings">
        <label>Participant limit <input name="participant_limit" type="number" min="0" max="50" value="0"></label>
        <label><input name="approval_required" type="checkbox"> Require host approval</label>
        <button type="submit">Save</button>
      </form>
      <button type="button" id="group-close" class="danger-button">Close session</button>
    </details>
  {% elif puzzle_type_definition and puzzle_type_definition.collaboration %}
    <details>
      <summary>Group Solve</summary>
      <form id="group-create">
        <label>Participant limit <input name="participant_limit" type="number" min="0" max="50" value="0"></label>
        <label><input name="approval_required" type="checkbox"> Require host approval</label>
        <button type="submit">Start Group Solve</button>
      </form>
      <form id="group-join">
        <label>Session code <input name="code" maxlength="26" required autocomplete="off"></label>
        <button type="submit">Join</button>
      </form>
      <p id="group-status" role="status"></p>
    </details>
  {% else %}
    <p class="muted">Group Solve is not available for this puzzle type yet.</p>
  {% endif %}
</section>
<style>
  #group-solve { margin: 0 0 20px; padding: 16px 0; border-top: 1px solid #d1d7d5; border-bottom: 1px solid #d1d7d5; }
  #group-solve h2 { font-size: 18px; }
  #group-solve form, .group-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin: 12px 0; }
  #group-solve label { max-width: 250px; }
  .group-members { display: flex; gap: 8px; flex-wrap: wrap; }
  .group-member { padding: 6px 8px; border: 1px solid #cbd5d0; border-radius: 4px; }
  .group-member button { margin-left: 6px; padding: 3px 6px; }
  #group-solve button { width: auto; flex: 0 0 auto; }
  .group-member button { display: inline-block; }
  .group-recent { box-shadow: inset 0 0 0 2px #388397 !important; }
  .group-focus { outline: 2px dashed #a66420; outline-offset: -3px; }
  .group-blocked { pointer-events: none; opacity: .65; }
  #group-solve [hidden] { display: none; }
</style>
